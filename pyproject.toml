[project]
name = "pcb-ai"
version = "0.1.0"
description = "Pipeline agéntico de EDA: requisitos → esquemático → ERC → simulación → PCB → DRC → fabricación (KiCad + Claude Code)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "rich>=13.9",
]

[project.scripts]
pcb-ai = "pcb_ai.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/pcb_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
